[project]
name = "overture-maps-jp-validation"
version = "0.1.0"
description = "Overture Maps の日本における網羅性・正確性を公的統計・公的空間データと比較して検証する"
authors = [
    { name = "shiwaku", email = "173521310+shiwaku@users.noreply.github.com" }
]
requires-python = ">=3.15"
license = "MIT"
dependencies = [
    "duckdb>=2.0.0",
]

[project.scripts]
overture-maps-jp-validation = "overture_maps_jp_validation:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
